# Keeps the free Supabase project from pausing after 7 days without activity.
# Needs repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (public values only).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 5 * * *" # daily, 09:17 Gulf Standard Time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Light read from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded $status"
          test "$status" = "200"
